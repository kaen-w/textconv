name: build-installers

# 手动触发：在 Actions 页面点 Run workflow，填一个已存在的 tag。
# 只负责构建产物，不自动发布 Release（发布由维护者确认后手动执行）。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（例如 v0.2.7）"
        required: true
      attach:
        description: "构建完直接上传到该 tag 的 Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller \
            pyobjc-framework-Cocoa pyobjc-framework-Quartz pyobjc-framework-ApplicationServices
      - name: 构建 dmg
        run: bash tools/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-win.txt pyinstaller
      - name: 安装 NSIS
        run: choco install nsis -y --no-progress
      - name: 构建在线安装包
        shell: bash
        run: |
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          ./tools/build_windows.sh
      - name: 构建自包含版
        shell: bash
        run: ./tools/build_windows_portable.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
      - name: 上传到 Release
        if: inputs.attach
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: dist/*.exe
