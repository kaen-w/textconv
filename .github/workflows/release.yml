name: release

# 手动触发：在 Actions 页面点 Run workflow，填一个已存在的 tag。
# 不跟 push tag 绑定，避免未经人确认的构建直接覆盖 Release 产物。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（例如 v0.2.6）"
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller \
            pyobjc-framework-Cocoa pyobjc-framework-Quartz pyobjc-framework-ApplicationServices
      - name: 构建 dmg
        run: bash tools/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
      - name: 安装 NSIS
        run: choco install nsis -y --no-progress
      - name: 构建 exe
        shell: bash
        run: |
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          ./tools/build_windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: artifacts/**/*
          generate_release_notes: false
